<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ketolabs</title>
<style>
  :root { --bg:#fff; --fg:#16201f; --muted:#5c6b69; --rule:#dfe5e4; --accent:#0f766e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1413; --fg:#e6ecea; --muted:#9aa8a5; --rule:#243130; --accent:#2dd4bf; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); padding:64px 16px;
    font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 32px; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--rule); }
  li { border-bottom:1px solid var(--rule); padding:16px 0; }
  a { color:var(--accent); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  .note { display:block; color:var(--muted); font-weight:400; font-size:0.9rem; margin-top:2px; }
  footer { margin-top:40px; color:var(--muted); font-size:0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Ketolabs</h1>
  <p>Android apps.</p>
  <ul>
    <li>
      <a href="warranty-keeper/">Warranty Keeper</a>
      <span class="note">Track warranties and get reminded before they expire &middot; privacy policy</span>
    </li>
  </ul>
  <footer>Contact: <a href="mailto:ketolabsindia@gmail.com">ketolabsindia@gmail.com</a></footer>
</main>
</body>
</html>
